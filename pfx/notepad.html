<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Notepad — PF X ASAE</title>
<link rel="icon" type="image/png" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/favicon.png">
<link rel="apple-touch-icon" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans', system-ui, sans-serif; background:#F4F1EA; color:#2F2F2F; padding:32px 16px 48px; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:520px; margin:0 auto; }
  .back { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#F47C2C; text-decoration:none; margin-bottom:20px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#F47C2C; margin-bottom:8px; }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-bottom:6px; }
  .sub { font-size:14px; color:#6E6E6E; margin-bottom:22px; }
  .composer { background:#F6F2E8; border:1px solid #E3DDD2; border-radius:16px; padding:16px; box-shadow:0 4px 16px rgba(120,110,95,.08); margin-bottom:12px; }
  input, textarea { width:100%; font-family:'DM Sans', system-ui, sans-serif; font-size:15px; color:#2F2F2F;
    background:#fff; border:1.5px solid #E3DDD2; border-radius:10px; padding:11px 13px; -webkit-appearance:none; }
  input:focus, textarea:focus { outline:none; border-color:#F47C2C; box-shadow:0 0 0 3px rgba(244,124,44,.14); }
  input { margin-bottom:9px; }
  textarea { min-height:88px; resize:vertical; margin-bottom:10px; }
  input::placeholder, textarea::placeholder { color:#A99F8E; }
  .savebtn { display:flex; align-items:center; justify-content:center; gap:6px; width:100%; padding:14px;
    font-size:15px; font-weight:800; font-family:'DM Sans', sans-serif; color:#fff; border:none; border-radius:100px;
    background:linear-gradient(to right,#F47C2C,#FBC02D); cursor:pointer; box-shadow:0 4px 14px rgba(240,90,40,.22); }
  .savebtn:disabled { opacity:.6; }
  .msg { font-size:12.5px; margin-top:8px; text-align:center; display:none; }
  .toolbar { display:flex; align-items:center; justify-content:space-between; margin:18px 0 10px; }
  .toolbar .cnt { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#6E6E6E; }
  .refresh { font-size:12.5px; font-weight:700; color:#F47C2C; background:none; border:none; cursor:pointer; font-family:'DM Sans',sans-serif; }
  .note { background:#F6F2E8; border:1px solid #E3DDD2; border-radius:14px; padding:13px 16px; margin-bottom:10px; }
  .note .t { font-size:14.5px; line-height:1.55; color:#2F2F2F; white-space:pre-wrap; word-wrap:break-word; }
  .note .m { font-size:11.5px; color:#A99F8E; margin-top:7px; }
  .note .m b { color:#F47C2C; }
  .empty { text-align:center; color:#A99F8E; font-size:13.5px; padding:26px 0; }
  .foot { margin-top:28px; font-size:11.5px; color:#A99F8E; text-align:center; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://pf-x-asae.vercel.app/">&larr; All links</a>
  <div class="eyebrow">Shared &middot; whole team sees it</div>
  <h1>Notepad</h1>
  <p class="sub">Ideas, lead intel, client notes, things to fix — drop it here while it&rsquo;s fresh. This feeds the wrap-up.</p>

  <div class="composer">
    <input id="who" placeholder="Your name" maxlength="30">
    <textarea id="text" placeholder="e.g. &ldquo;Talked to VP Membership at XYZ Assn — loved the money booth, wants Membership AI demo, badge scanned&rdquo;"></textarea>
    <button class="savebtn" id="save">Add note</button>
    <p class="msg" id="msg"></p>
  </div>

  <div class="toolbar">
    <span class="cnt" id="cnt"></span>
    <button class="refresh" id="refresh">&#8635; Refresh</button>
  </div>
  <div id="list"></div>

  <p class="foot">Notes sync for everyone with the link. Newest first.<br>Shared store — don&rsquo;t paste anything truly sensitive.</p>
</div>
<script>
  var KEY = 'pfx-asae-e2a91d93-ff10-4d17-99ab-63e32e4d94d7';
  var READ = 'https://textdb.online/' + KEY;
  var WRITE = 'https://textdb.online/update';
  var whoEl = document.getElementById('who'), textEl = document.getElementById('text');
  var saveBtn = document.getElementById('save'), msgEl = document.getElementById('msg');
  try { whoEl.value = localStorage.getItem('pfxName') || ''; } catch (e) {}

  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function when(iso) {
    var d = new Date(iso);
    return d.toLocaleString('en-US', { timeZone: 'America/Indiana/Indianapolis', weekday: 'short', hour: 'numeric', minute: '2-digit' }) + ' ET';
  }
  function render(notes) {
    var list = document.getElementById('list');
    document.getElementById('cnt').textContent = notes.length + (notes.length === 1 ? ' note' : ' notes');
    if (!notes.length) { list.innerHTML = '<div class="empty">Nothing yet — be the first.</div>'; return; }
    list.innerHTML = notes.slice().reverse().map(function (n) {
      return '<div class="note"><div class="t">' + esc(n.text) + '</div>' +
        '<div class="m"><b>' + esc(n.who || 'Anonymous') + '</b> · ' + when(n.at) + '</div></div>';
    }).join('');
  }
  function load() {
    return fetch(READ + '?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) { render(d.notes || []); return d.notes || []; })
      .catch(function () {
        document.getElementById('list').innerHTML = '<div class="empty">Couldn&rsquo;t load — check connection and hit Refresh.</div>';
        return null;
      });
  }
  function flash(t, ok) {
    msgEl.textContent = t; msgEl.style.display = 'block'; msgEl.style.color = ok ? '#2e7d32' : '#C5392E';
    setTimeout(function(){ msgEl.style.display = 'none'; }, 3500);
  }
  document.getElementById('save').addEventListener('click', function () {
    var who = whoEl.value.trim(), text = textEl.value.trim();
    if (!text) { flash('Write something first.', false); return; }
    try { localStorage.setItem('pfxName', who); } catch (e) {}
    saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
    // read-merge-write so simultaneous saves don't clobber each other
    fetch(READ + '?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
      var notes = (d && d.notes) || [];
      notes.push({ who: who || 'Anonymous', text: text, at: new Date().toISOString() });
      var body = new URLSearchParams();
      body.append('key', KEY);
      body.append('value', JSON.stringify({ notes: notes }));
      return fetch(WRITE, { method: 'POST', body: body }).then(function (r) { return r.json(); }).then(function (res) {
        if (!res || res.status !== 1) throw new Error('save failed');
        textEl.value = '';
        render(notes);
        flash('Saved — everyone can see it.', true);
      });
    }).catch(function () {
      flash('Save failed — your note is still in the box. Check connection and try again.', false);
    }).finally(function () {
      saveBtn.disabled = false; saveBtn.textContent = 'Add note';
    });
  });
  document.getElementById('refresh').addEventListener('click', load);
  load();
</script>
</body>
</html>
