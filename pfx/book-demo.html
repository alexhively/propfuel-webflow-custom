<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Book a Demo — PF X ASAE</title>
<link rel="icon" type="image/png" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/favicon.png">
<link rel="apple-touch-icon" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans', system-ui, sans-serif; background:#F4F1EA; color:#2F2F2F;
    min-height:100svh; display:flex; flex-direction:column; align-items:center; padding:32px 20px 40px;
    -webkit-font-smoothing:antialiased; }
  .wrap { width:100%; max-width:420px; }
  .back { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#F47C2C; text-decoration:none; margin-bottom:20px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#F47C2C; text-align:center; margin-bottom:10px; }
  h1 { font-size:28px; font-weight:800; letter-spacing:-.02em; line-height:1.1; text-align:center; margin-bottom:6px; }
  .sub { font-size:14px; color:#6E6E6E; text-align:center; margin-bottom:28px; }
  .names { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .nbtn { position:relative; display:flex; align-items:center; justify-content:center; padding:22px 10px;
    border-radius:16px; text-decoration:none; font-size:17px; font-weight:800; letter-spacing:-.01em;
    background:#F6F2E8; border:1.5px solid #E3DDD2; color:#2F2F2F;
    box-shadow:0 4px 16px rgba(120,110,95,.08); transition:transform .12s ease; }
  .nbtn:active { transform:scale(.97); }
  .nbtn.me { background:linear-gradient(to right,#F47C2C,#FBC02D); border-color:transparent; color:#fff;
    box-shadow:0 6px 20px rgba(240,90,40,.25); }
  .nbtn.me::after { content:'you?'; position:absolute; top:8px; right:10px; font-size:9px; font-weight:700;
    letter-spacing:.08em; text-transform:uppercase; color:rgba(255,255,255,.85); }
  .general { display:block; text-align:center; margin-top:22px; font-size:13px; font-weight:700; color:#F47C2C; text-decoration:none; }
  .foot { margin-top:auto; padding-top:36px; font-size:12px; color:#A99F8E; text-align:center; }
</style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="https://pf-x-asae.vercel.app/">&larr; All links</a>
    <div class="eyebrow">Book a Demo</div>
    <h1>Who are you?</h1>
    <p class="sub">Tap your name — your personal booking page opens. Have the prospect enter their email there.</p>
    <nav class="names" id="names"></nav>
    <a class="general" href="https://www.propfuel.com/asae-annual">Not on the list? Use the general booking page &rarr;</a>
  </div>
  <div class="foot">propfuel.com</div>
<script>
  var REPS = ['Clara', 'Mike', 'Ashley', 'Ryan', 'Brett', 'Dave', 'Brittany'];
  var mine = '';
  try { mine = (localStorage.getItem('pfxName') || '').toLowerCase(); } catch (e) {}
  document.getElementById('names').innerHTML = REPS.map(function (n) {
    var slug = n.toLowerCase();
    var isMe = mine && mine.indexOf(slug) === 0;
    return '<a class="nbtn' + (isMe ? ' me' : '') + '" href="https://www.propfuel.com/asae-annual-' + slug + '">' + n + '</a>';
  }).join('');
</script>
</body>
</html>
