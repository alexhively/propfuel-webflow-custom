<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demo Tracker — PF X ASAE</title>
<link rel="icon" type="image/png" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/favicon.png">
<link rel="apple-touch-icon" href="https://alexhively.github.io/propfuel-webflow-custom/pfx/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans', system-ui, sans-serif; background:#F4F1EA; color:#2F2F2F; padding:32px 16px 48px; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:520px; margin:0 auto; }
  .back { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:#F47C2C; text-decoration:none; margin-bottom:20px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:#F47C2C; margin-bottom:8px; }
  h1 { font-size:26px; font-weight:800; letter-spacing:-.02em; line-height:1.15; margin-bottom:6px; }
  .sub { font-size:14px; color:#6E6E6E; margin-bottom:28px; }
  .hero { background:#F6F2E8; border:1px solid #E3DDD2; border-radius:20px; padding:28px 24px; text-align:center; box-shadow:0 4px 16px rgba(120,110,95,.08); }
  .big { font-size:64px; font-weight:900; letter-spacing:-.03em; line-height:1;
    background:linear-gradient(to top,#F47C2C,#FBC02D); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .big small { font-size:26px; font-weight:800; -webkit-text-fill-color:#A99F8E; }
  .hero .lbl { font-size:13px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:#6E6E6E; margin-top:8px; }
  .bar { height:12px; background:#EBE6DA; border-radius:100px; margin:18px 0 8px; overflow:hidden; }
  .bar .fill { height:100%; border-radius:100px; background:linear-gradient(to right,#F47C2C,#FBC02D); transition:width .8s cubic-bezier(.2,.7,.3,1); width:0; }
  .pct { font-size:12px; color:#A99F8E; }
  .srcs { display:flex; flex-direction:column; gap:10px; margin-top:22px; }
  .src { display:flex; align-items:center; justify-content:space-between; background:#F6F2E8; border:1px solid #E3DDD2; border-radius:14px; padding:14px 18px; }
  .src .n { font-size:15px; font-weight:700; }
  .src .c { font-size:22px; font-weight:900; letter-spacing:-.02em;
    background:linear-gradient(to top,#F47C2C,#FBC02D); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .meta { margin-top:24px; font-size:12.5px; color:#A99F8E; text-align:center; line-height:1.6; }
  .note { border-left:4px solid #FBC02D; background:#F6F2E8; border-radius:0 12px 12px 0; padding:12px 14px; margin-top:20px; font-size:13.5px; line-height:1.55; color:#4a4a48; }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://pf-x-asae.vercel.app/">&larr; All links</a>
  <div class="eyebrow" id="quarter">Demos Booked</div>
  <h1>Demo Request Tracker</h1>
  <p class="sub" id="goalline">Current-quarter demos booked, by source.</p>

  <div class="hero">
    <div class="big"><span id="total">–</span><small id="goaltag"></small></div>
    <div class="lbl" id="herolbl">Demos booked</div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct"></div>
  </div>

  <div class="srcs" id="srcs"></div>

  <p class="meta" id="updated"></p>
  <div class="note" id="note" style="display:none"></div>
</div>
<script>
  var DATA_URL = 'https://alexhively.github.io/propfuel-webflow-custom/pfx/demo-tracker.json';
  fetch(DATA_URL + '?t=' + Date.now())
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var total = d.sources.reduce(function (a, s) { return a + (s.count || 0); }, 0);
      document.getElementById('quarter').textContent = d.quarter + ' · Demos Booked';
      document.getElementById('total').textContent = total;
      if (d.goal) {
        document.getElementById('goaltag').textContent = ' / ' + d.goal;
        var pct = Math.min(100, Math.round(total / d.goal * 100));
        setTimeout(function(){ document.getElementById('fill').style.width = pct + '%'; }, 100);
        document.getElementById('pct').textContent = pct + '% of ' + (d.goalLabel || 'goal');
        document.getElementById('goalline').textContent = d.quarter + ' demos booked — goal ' + d.goal + ' (' + (d.goalLabel || '') + ').';
      }
      document.getElementById('srcs').innerHTML = d.sources.map(function (s) {
        return '<div class="src"><span class="n">' + s.label + '</span><span class="c">' + (s.count == null ? '–' : s.count) + '</span></div>';
      }).join('');
      if (d.booked && d.booked.length) {
        document.getElementById('srcs').innerHTML += '<div style="margin-top:14px"></div>' + d.booked.map(function (b) {
          return '<div class="src" style="padding:11px 18px"><span style="font-size:13.5px;line-height:1.4"><b>' + b.org + '</b><br><span style="color:#A99F8E;font-size:12px">' + b.rep + ' · ' + b.status + '</span></span></div>';
        }).join('');
      }
      document.getElementById('updated').innerHTML = 'Last updated ' + d.updated + '<br>Source: ' + (d.dataSource || 'Salesforce');
      if (d.note) { var n = document.getElementById('note'); n.style.display = 'block'; n.textContent = d.note; }
    })
    .catch(function () {
      document.getElementById('updated').textContent = 'Could not load tracker data — check connection.';
    });
</script>
</body>
</html>
